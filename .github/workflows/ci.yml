name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup reads it from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Contracts are EXTRACTED from @brightlocal/ui-components' shipped
      # .d.ts. A version bump without a regeneration silently reintroduces
      # the drift that had save_screen rejecting props the package really
      # has — so fail the build instead of discovering it in a prototype.
      - name: Check registry contracts are in sync
        run: pnpm -F @gradeui/studio check:contracts

      # The behavioural half: JSX that should save, saves. Every positive
      # case is a snippet save_screen used to reject.
      - name: Verify BrightLocal contracts against the validator
        run: pnpm -F @gradeui/studio verify:brightlocal-contracts

      - name: Build packages
        run: pnpm -r --filter "./packages/*" build

      - name: Build docs
        run: pnpm --filter @gradeui/docs build
        env:
          # docs build may read these at compile-time — supply empty defaults so
          # the PR build doesn't fail for missing secrets.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-dummy-secret-please-replace' }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID || '' }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET || '' }}
