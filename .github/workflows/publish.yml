name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # No `if:` guard needed. The changesets action uses a PR-based flow: version
    # bumps land on `changeset-release/main`, not directly on main. When that PR
    # is merged, we WANT the resulting merge commit to run this job — that's
    # the run that actually publishes to npm.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `version:` — read from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm -r --filter "./packages/*" build

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          # `pnpm release` (defined in root package.json) runs `pnpm build` then `changeset publish`.
          # `version:` is left at the default (`changeset version`). We can't use
          # `pnpm version` because that's a pnpm built-in, not the npm script.
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
