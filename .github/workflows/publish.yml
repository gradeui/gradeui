name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Avoid infinite loops: the changesets action bumps versions and pushes a
    # commit. That push would re-trigger this workflow; the guard below skips
    # the job when we see the version-bump commit message.
    # (Quoted because YAML can trip on `!` right after `${{`.)
    if: "${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore: version packages') }}"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `version:` — read from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm -r --filter "./packages/*" build

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          # `pnpm release` (defined in root package.json) runs `pnpm build` then `changeset publish`.
          # `version:` is left at the default (`changeset version`). We can't use
          # `pnpm version` because that's a pnpm built-in, not the npm script.
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
